name: сборка сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: установка
        run: pnpm install --frozen-lockfile

      - name: сборка
        run: pnpm build

      - name: подготовка ветки deploy
        run: |
          mkdir -p out
          cp -r dist out/dist
          cp deploy-template/package.json out/package.json
          cp deploy-template/pnpm-lock.yaml out/pnpm-lock.yaml
          cp deploy-template/README.md out/README.md

      - name: публикация в ветку deploy
        run: |
          cd out
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "сборка ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
