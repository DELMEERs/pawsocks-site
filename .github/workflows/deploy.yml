name: сборка сайта

# хостингу не хватает памяти на astro build, поэтому сайт собирается здесь,
# а готовая папка dist коммитится обратно в main. хостинг только раздаёт её.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: установка
        run: pnpm install --frozen-lockfile

      - name: сборка
        run: pnpm build

      - name: коммит готовой сборки
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --cached --quiet; then
            echo "сборка не изменилась"
            exit 0
          fi
          git commit -q -m "сборка ${GITHUB_SHA::7} [skip ci]"
          git push
